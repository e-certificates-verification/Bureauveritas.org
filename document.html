<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Document PDF Viewer</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #ffffff;
  }

  body {
    font-family: Arial, sans-serif;
  }

  #pages {
    width: 100%;
    min-height: 100dvh;
    margin: 0;
    padding: 0;
    background: white;
  }

  .pdf-page {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
  }

  #message {
    padding: 24px 16px;
    text-align: center;
    color: #333;
    font-size: 15px;
  }
</style>
</head>

<body>

<div id="message">Loading PDF...</div>
<main id="pages"></main>

<script type="module">
import * as pdfjsLib from
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const params = new URLSearchParams(
  window.location.search
);

const file = params.get("file");

const pagesContainer =
  document.getElementById("pages");

const message =
  document.getElementById("message");

let pdfDocument = null;
let rendering = false;

async function renderPDF() {
  if (!pdfDocument || rendering) return;

  rendering = true;

  try {
    pagesContainer.innerHTML = "";

    const containerWidth =
      pagesContainer.clientWidth;

    const pixelRatio = Math.min(
      window.devicePixelRatio || 1,
      3
    );

    for (
      let pageNumber = 1;
      pageNumber <= pdfDocument.numPages;
      pageNumber++
    ) {
      const page =
        await pdfDocument.getPage(pageNumber);

      const baseViewport =
        page.getViewport({ scale: 1 });

      const scale =
        containerWidth / baseViewport.width;

      const viewport =
        page.getViewport({ scale });

      const canvas =
        document.createElement("canvas");

      canvas.className = "pdf-page";

      const context =
        canvas.getContext("2d", {
          alpha: false
        });

      canvas.width = Math.ceil(
        viewport.width * pixelRatio
      );

      canvas.height = Math.ceil(
        viewport.height * pixelRatio
      );

      canvas.style.width =
        viewport.width + "px";

      canvas.style.height =
        viewport.height + "px";

      pagesContainer.appendChild(canvas);

      await page.render({
        canvasContext: context,
        viewport: viewport,
        transform: [
          pixelRatio, 0,
          0, pixelRatio,
          0, 0
        ]
      }).promise;
    }
  } finally {
    rendering = false;
  }
}

async function loadPDF() {
  if (!file) {
    message.textContent =
      "No PDF selected.";
    return;
  }

  if (
    !file.toLowerCase().endsWith(".pdf") ||
    file.includes("..") ||
    file.startsWith("/") ||
    file.includes("\\") ||
    file.includes(":") ||
    file.includes("?") ||
    file.includes("#")
  ) {
    message.textContent =
      "Invalid PDF file path.";
    return;
  }

  try {
    const pdfURL = new URL(
      file,
      window.location.href
    );

    if (pdfURL.origin !== window.location.origin) {
      throw new Error("Invalid PDF origin");
    }

    pdfDocument =
      await pdfjsLib.getDocument(
        pdfURL.href
      ).promise;

    message.style.display = "none";

    await renderPDF();

  } catch (error) {
    message.style.display = "block";
    message.textContent =
      "Unable to load PDF. Check the file name.";
    console.error(error);
  }
}

loadPDF();
</script>

</body>
</html>
